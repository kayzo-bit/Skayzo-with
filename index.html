<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pertama Saya</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #333;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
    }
    section {
      padding: 40px;
      max-width: 900px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #e5e7eb;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <header>
    <h1>Selamat Datang 👋</h1>
    <p>Ini adalah website pertama saya</p>
  </header>

  <section>
    <div class="card">
      <h2>Tentang Website</h2>
      <p>
        Website ini dibuat menggunakan HTML dan CSS sederhana.
        Cocok untuk belajar atau dijadikan landing page.
      </p>
      <button onclick="alert('Terima kasih sudah klik!')">
        Klik Saya
      </button>
    </div>
  </section>

  <footer>
    © 2026 Website Saya
  </footer>

</body>
</html>
